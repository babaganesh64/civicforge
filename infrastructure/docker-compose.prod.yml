version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civicforge
      POSTGRES_PASSWORD: civicforge_dev_password
      POSTGRES_DB: civicforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  ai-service:
    build:
      context: ../ai-service
    ports:
      - "8000:8000"

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/civicforge
      - SPRING_DATASOURCE_USERNAME=civicforge
      - SPRING_DATASOURCE_PASSWORD=civicforge_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_JWT_SECRET=dGhpcy1pcy1hLXZlcnktc2VjdXJlLXNlY3JldC1rZXktdGhhdC1pcy1sb25nLWVub3VnaA==
      - APP_AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
